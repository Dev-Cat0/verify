<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인증 본부</title>
<style>
  :root { --bg:#000; --fg:#fff; --mute:#8a8a8a; --line:#262626; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--fg); font-family:-apple-system,"Pretendard","Noto Sans KR",sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  main { width:100%; max-width:420px; }
  h1 { font-size:28px; font-weight:700; letter-spacing:-.02em; }
  .sub { color:var(--mute); margin-top:8px; font-size:15px; line-height:1.5; }
  button { font:inherit; cursor:pointer; border:1px solid var(--fg); background:var(--fg); color:var(--bg);
           padding:14px 20px; border-radius:10px; font-weight:600; width:100%; transition:opacity .15s; }
  button:hover { opacity:.85; }
  button:disabled { background:transparent; color:var(--mute); border-color:var(--line); cursor:default; }
  .start { margin-top:32px; }
  #steps { display:none; margin-top:32px; }
  .step { border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:12px; }
  .step.active { border-color:var(--fg); }
  .step.done { opacity:.6; }
  .step .head { display:flex; align-items:center; gap:12px; margin-bottom:6px; }
  .num { width:26px; height:26px; border-radius:50%; border:1px solid var(--fg); display:flex;
         align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0; }
  .step.done .num { background:var(--fg); color:var(--bg); }
  .step .title { font-weight:600; }
  .step p { color:var(--mute); font-size:14px; margin:0 0 14px 38px; line-height:1.5; }
  .step button { margin-left:38px; width:calc(100% - 38px); }
  #msg { margin-top:16px; font-size:14px; color:var(--mute); text-align:center; min-height:20px; }
  #msg.err { color:var(--fg); text-decoration:underline; }
  .finish { text-align:center; }
  .finish .check { font-size:48px; margin-bottom:12px; }
</style>
</head>
<body>
<main>
  <div id="home">
    <h1>인증 본부</h1>
    <p class="sub">디스코드와 로블록스 계정을 연결해<br>서버 인증을 진행합니다.</p>
    <button class="start" id="startBtn">인증하기</button>
  </div>

  <div id="steps">
    <h1>인증 진행</h1>
    <p class="sub" style="margin-bottom:24px">두 단계를 순서대로 완료해주세요.</p>

    <div class="step" id="step1">
      <div class="head"><div class="num">1</div><div class="title">디스코드 계정 인증</div></div>
      <p>계정 정보(아이디, 이메일, 서버 목록)를 확인하고 서버 참가 권한을 승인합니다.</p>
      <button id="discordBtn">디스코드로 인증</button>
    </div>

    <div class="step" id="step2">
      <div class="head"><div class="num">2</div><div class="title">로블록스 계정 인증</div></div>
      <p>로블록스 유저 ID, 사용자 이름, 이메일 주소를 확인합니다.</p>
      <button id="robloxBtn" disabled>로블록스로 인증</button>
    </div>

    <div id="msg"></div>
  </div>

  <div id="finish" class="finish" style="display:none">
    <div class="check">✓</div>
    <h1>인증 요청 완료</h1>
    <p class="sub">운영진이 확인하면 인증이 마무리됩니다.<br>이 창은 닫으셔도 됩니다.</p>
  </div>
</main>

<script>
/* ===== 설정 (여기만 수정하세요) ===== */
const CONFIG = {
  API_BASE: "https://verify-api.iloowaboy.workers.dev",          // 봇 API 주소 (https 필수, 끝에 / 없이)
  DISCORD_CLIENT_ID: "1566032793316761780",
  ROBLOX_CLIENT_ID: "1047929400110369315",
};
/* =================================== */

// 이 페이지 주소가 곧 Redirect URI (끝의 index.html은 제거)
const REDIRECT_URI = location.origin + location.pathname.replace(/index\.html$/, "");

const $ = (id) => document.getElementById(id);
const store = sessionStorage;

function randomState(prefix) {
  const a = new Uint8Array(16);
  crypto.getRandomValues(a);
  return prefix + "." + Array.from(a, b => b.toString(16).padStart(2, "0")).join("");
}
function setMsg(t, err = false) { $("msg").textContent = t; $("msg").className = err ? "err" : ""; }
function showSteps() { $("home").style.display = "none"; $("steps").style.display = "block"; }

function render() {
  const hasSession = !!store.getItem("session");
  $("step1").className = "step " + (hasSession ? "done" : "active");
  $("step2").className = "step " + (hasSession ? "active" : "");
  $("discordBtn").disabled = hasSession;
  $("robloxBtn").disabled = !hasSession;
}

$("startBtn").onclick = () => { showSteps(); render(); };

$("discordBtn").onclick = () => {
  const state = randomState("d");
  store.setItem("oauth_state", state);
  const p = new URLSearchParams({
    client_id: CONFIG.DISCORD_CLIENT_ID,
    redirect_uri: REDIRECT_URI,
    response_type: "code",
    scope: "identify email guilds guilds.join",
    state,
    prompt: "consent",
  });
  location.href = "https://discord.com/oauth2/authorize?" + p;
};

$("robloxBtn").onclick = () => {
  const state = randomState("r");
  store.setItem("oauth_state", state);
  const p = new URLSearchParams({
    client_id: CONFIG.ROBLOX_CLIENT_ID,
    redirect_uri: REDIRECT_URI,
    response_type: "code",
    scope: "openid profile email",
    state,
  });
  location.href = "https://apis.roblox.com/oauth/v1/authorize?" + p;
};

async function api(path, body) {
  const res = await fetch(CONFIG.API_BASE + path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "요청에 실패했습니다.");
  return data;
}

async function handleCallback() {
  const q = new URLSearchParams(location.search);
  const code = q.get("code"), state = q.get("state");
  if (q.get("error")) {
    history.replaceState(null, "", REDIRECT_URI);
    showSteps(); render(); setMsg("인증이 취소되었습니다.", true);
    return;
  }
  if (!code || !state) { render(); return; }

  history.replaceState(null, "", REDIRECT_URI);
  showSteps(); render();

  if (state !== store.getItem("oauth_state")) { setMsg("잘못된 요청입니다. 다시 시도해주세요.", true); return; }
  store.removeItem("oauth_state");

  try {
    if (state.startsWith("d.")) {
      setMsg("디스코드 계정 확인 중...");
      const r = await api("/api/discord", { code });
      store.setItem("session", r.session);
      render(); setMsg("");
    } else if (state.startsWith("r.")) {
      const session = store.getItem("session");
      if (!session) { setMsg("디스코드 인증부터 진행해주세요.", true); return; }
      setMsg("로블록스 계정 확인 중...");
      await api("/api/roblox", { code, session });
      store.removeItem("session");
      $("steps").style.display = "none"; $("finish").style.display = "block";
    }
  } catch (e) {
    setMsg(e.message, true);
    if (state.startsWith("d.")) store.removeItem("session");
    render();
  }
}

if (store.getItem("session")) { showSteps(); }
handleCallback();
</script>
</body>
</html>
